name: Build and deploy Godot demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2
  GODOT_RELEASE: 3.6.2-stable
  GODOT_HEADLESS_SHA512: 674dd18e89d4eaac62d83346776133abf987b6e85dad9b6842bd5f574d954c6f2774e9f527d4b763ba9f4765ee0c427b58dcadf96cd8da09ac8fae0ec08f3693
  GODOT_TEMPLATES_SHA512: 11609918871f773b5945285ab24bb516af332afa3d3185bf65e51bab81195d4aec9fd235576771e4f08e5d8e4995ccce7f6f97162c56ad95171b661dd10aa08c

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Configure Godot paths
        shell: bash
        run: |
          echo "GODOT_CACHE_ROOT=${RUNNER_TOOL_CACHE}/godot-ci/${GODOT_RELEASE}" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=${RUNNER_TOOL_CACHE}/godot-ci/${GODOT_RELEASE}/xdg-data" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=${RUNNER_TEMP}/xdg-config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=${RUNNER_TEMP}/xdg-cache" >> "$GITHUB_ENV"

      - name: Prepare pinned Godot 3 exporter
        shell: bash
        run: |
          set -euo pipefail
          godot="$GODOT_CACHE_ROOT/Godot_v${GODOT_RELEASE}_linux_headless.64"
          marker="$GODOT_CACHE_ROOT/checksums"
          expected="${GODOT_HEADLESS_SHA512} ${GODOT_TEMPLATES_SHA512}"
          if test -x "$godot" && test -f "$marker" && test "$(cat "$marker")" = "$expected"; then
            echo "Using cached Godot ${GODOT_RELEASE} exporter"
            exit 0
          fi

          editor="Godot_v${GODOT_RELEASE}_linux_headless.64.zip"
          templates="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          base_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          download_dir="${RUNNER_TEMP}/godot-download"
          mkdir -p "$download_dir" "$GODOT_CACHE_ROOT"
          curl --fail --location --retry 3 --output "$download_dir/$editor" "$base_url/$editor"
          curl --fail --location --retry 3 --output "$download_dir/$templates" "$base_url/$templates"
          echo "$GODOT_HEADLESS_SHA512  $download_dir/$editor" | sha512sum --check --strict
          echo "$GODOT_TEMPLATES_SHA512  $download_dir/$templates" | sha512sum --check --strict
          unzip -oq "$download_dir/$editor" -d "$GODOT_CACHE_ROOT"
          mkdir -p "$XDG_DATA_HOME/godot/templates/${GODOT_VERSION}.stable"
          unzip -oq "$download_dir/$templates" -d "${RUNNER_TEMP}/templates"
          cp -R "${RUNNER_TEMP}/templates/templates/." "$XDG_DATA_HOME/godot/templates/${GODOT_VERSION}.stable/"
          printf '%s' "$expected" > "$marker"

      - name: Export HTML5 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$GODOT_CACHE_ROOT/Godot_v${GODOT_RELEASE}_linux_headless.64" \
            --path demos/elanco-manufacturing-digital-twin \
            --export "Web" "$GITHUB_WORKSPACE/dist/index.html"
          test -s dist/index.html
          test -s dist/index.wasm
          test -s dist/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
